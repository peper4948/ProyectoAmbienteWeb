<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="card shadow" style="max-width: 420px; width: 100%;">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4" style="font-weight: 700;">Iniciar sesión</h4>

                    <div th:if="${param.error != null}" class="alert alert-danger text-center" role="alert">
                        Usuario o contraseña incorrectos.
                    </div>
                    <form method="post" th:action="@{/login}">
                        <div class="form-group mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" id="username" name="username" class="form-control" placeholder="Nombre de usuario" required autofocus>
                        </div>

                        <div class="form-group mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required>
                        </div>

                        <button type="submit" class="btn btn-blcm w-100 mt-2">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
